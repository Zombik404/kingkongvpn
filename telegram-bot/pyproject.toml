[project]
name = "globalvpn-bot"
version = "0.1.0"
description = "Telegram bot: entry point to the Mini App, deep-link invites"
requires-python = ">=3.12"
dependencies = ["aiogram>=3.28,<4"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "mypy>=1.11", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
