# Development stack. Not for production (see documentation/DEPLOYMENT_GUIDE.md, Phase 12).
#   cp .env.example .env && make keys && docker compose up -d
# Infrastructure services start by default; application services use the `app`
# profile until their phase delivers runnable code:  docker compose --profile app up

name: globalvpn

x-backend-common: &backend-common
  build:
    context: ./backend
    target: dev
  env_file:
    - path: .env
      required: false   # app settings fail fast on missing required values (Phase 2)
  volumes:
    - ./backend:/app
    - ./secrets:/run/secrets:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"   # web UI
      - "127.0.0.1:1025:1025"   # SMTP
    restart: unless-stopped

  backend:
    <<: *backend-common
    profiles: ["app"]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/live').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    <<: *backend-common
    profiles: ["app"]
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO"]

  beat:
    <<: *backend-common
    profiles: ["app"]
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=INFO"]

volumes:
  pgdata:
  redisdata:
